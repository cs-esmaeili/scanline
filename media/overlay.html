<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
{{cspMeta}}
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="{{styleHref}}" />
<title>Search</title>
</head>
<body data-theme="{{theme}}" data-mode="{{mode}}">
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-label="Search everywhere">
      <div class="input-row">
        <span class="search-icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.3 10.3L14 14"/></svg></span>
        <input id="query" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search everywhere" />
        <span class="spinner" id="spinner"></span>
        <span class="esc">Esc</span>
        <button class="page-only close-button" id="close" title="Close (Esc)" aria-label="Close"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="results" id="results"></div>
      <div class="footer">
        <div class="hints">&#8593;&#8595; navigate &middot; Enter open &middot; <span class="webview-only">Alt+Enter in Search Editor &middot; </span>Tab switch tab &middot; Esc close</div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
  {{scriptTag}}
</body>
</html>
